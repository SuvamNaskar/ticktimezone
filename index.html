<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#111111" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="TimeTickZone" />
  <meta name="description" content="Compare and convert meeting times between two time zones in real time." />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="TimeTickZone" />
  <meta property="og:title" content="TimeTickZone — Live Time Zone Sync" />
  <meta property="og:description" content="Compare and convert meeting times between two time zones in real time." />
  <meta property="og:url" content="https://suvamnaskar.github.io/ticktimezone/" />
  <meta property="og:image" content="https://suvamnaskar.github.io/ticktimezone/og-image.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="TimeTickZone — Live Time Zone Sync" />
  <meta name="twitter:description" content="Compare and convert meeting times between two time zones in real time." />
  <meta name="twitter:image" content="https://suvamnaskar.github.io/ticktimezone/og-image.png" />
  <title>TimeTickZone</title>
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png" />
  <style>
    :root {
      --bg: #ecece8;
      --surface: #ffffff;
      --ink: #111111;
      --muted: #525252;
      --border: #111111;
      --yellow: #fde047;
      --green: #10b981;
      --shadow: 4px 4px 0px #111111;
      --shadow-sm: 3px 3px 0px #111111;
      --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, Helvetica, Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--sans);
      color: var(--ink);
      background-color: var(--bg);
      background-image: radial-gradient(#c4c4be 1px, transparent 1px);
      background-size: 16px 16px;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      line-height: 1.35;
    }

    .topbar {
      background: var(--surface);
      border-bottom: 2px solid var(--border);
      padding: 12px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .brand {
      font-family: var(--mono);
      font-size: 0.9rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      display: flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }

    .brand-prompt {
      color: var(--muted);
    }

    .actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .status-pill {
      font-family: var(--mono);
      font-size: 0.68rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 4px 8px;
      border: 1.5px solid var(--border);
      background: var(--surface);
      white-space: nowrap;
    }

    .dot {
      width: 7px;
      height: 7px;
      background: var(--green);
      display: inline-block;
    }

    .dot.paused {
      background: var(--yellow);
      border: 1px solid var(--border);
    }

    button.btn {
      appearance: none;
      font-family: var(--mono);
      font-size: 0.74rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      background: var(--surface);
      color: var(--ink);
      border: 2px solid var(--border);
      box-shadow: var(--shadow-sm);
      min-height: 36px;
      padding: 6px 11px;
      cursor: pointer;
      transition: transform 0.08s ease, box-shadow 0.08s ease, background 0.12s ease;
      -webkit-tap-highlight-color: transparent;
    }

    button.btn:hover {
      background: var(--yellow);
    }

    button.btn:active {
      transform: translate(2px, 2px);
      box-shadow: 1px 1px 0px var(--border);
    }

    button.btn.primary {
      background: var(--yellow);
    }

    .container {
      width: 100%;
      max-width: 820px;
      margin: 0 auto;
      padding: 26px 18px 40px;
      flex: 1;
    }

    .hero {
      margin-bottom: 20px;
    }

    .hero h1 {
      font-size: clamp(1.9rem, 5vw, 2.75rem);
      font-weight: 900;
      letter-spacing: -0.04em;
      line-height: 1.05;
    }

    .hero-sub {
      margin-top: 10px;
      padding-left: 12px;
      border-left: 3px solid var(--border);
      font-size: 0.92rem;
      color: var(--muted);
      font-weight: 500;
    }

    .diff-bar {
      background: var(--surface);
      border: 2px solid var(--border);
      box-shadow: var(--shadow);
      padding: 11px 14px;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
      font-size: 0.88rem;
    }

    .diff-text strong {
      font-weight: 800;
    }

    .diff-tag {
      font-family: var(--mono);
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      background: var(--yellow);
      border: 1.5px solid var(--border);
      padding: 3px 8px;
      white-space: nowrap;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
    }

    @media (max-width: 680px) {
      .grid {
        grid-template-columns: 1fr;
      }
      .topbar {
        padding: 10px 14px;
      }
      .container {
        padding: 18px 14px 32px;
      }
    }

    .card {
      background: var(--surface);
      border: 2px solid var(--border);
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
    }

    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 10px 14px;
      border-bottom: 2px solid var(--border);
      background: #f8f8f6;
    }

    .card.active .card-header {
      background: var(--ink);
      color: var(--surface);
    }

    .label-input {
      font-family: var(--mono);
      font-size: 0.82rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      border: 1.5px solid transparent;
      background: transparent;
      color: inherit;
      padding: 4px 6px;
      margin: -4px -6px;
      width: 100%;
      max-width: 185px;
    }

    .label-input:hover {
      border-color: currentColor;
    }

    .label-input:focus {
      outline: none;
      border-color: var(--yellow);
      background: rgba(253, 224, 71, 0.18);
    }

    .day-badge {
      font-family: var(--mono);
      font-size: 0.68rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      padding: 3px 7px;
      border: 1.5px solid var(--border);
      background: var(--surface);
      color: var(--ink);
      white-space: nowrap;
    }

    .card.active .day-badge {
      background: var(--yellow);
      border-color: var(--yellow);
      color: var(--ink);
    }

    .day-badge.shifted {
      background: var(--yellow);
      color: var(--ink);
    }

    .card-body {
      padding: 16px 14px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .field label {
      font-family: var(--mono);
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: var(--muted);
    }

    .tz-row {
      display: grid;
      grid-template-columns: 1fr 92px;
      gap: 8px;
    }

    select,
    input[type="text"].ctrl,
    input[type="time"].ctrl {
      width: 100%;
      min-height: 44px;
      border: 2px solid var(--border);
      background: var(--surface);
      color: var(--ink);
      padding: 8px 10px;
      font-size: 16px;
      font-family: var(--sans);
      border-radius: 0;
      appearance: none;
      -webkit-appearance: none;
    }

    select {
      background-image: linear-gradient(45deg, transparent 50%, var(--ink) 50%),
                        linear-gradient(135deg, var(--ink) 50%, transparent 50%);
      background-position: calc(100% - 16px) 50%, calc(100% - 11px) 50%;
      background-size: 5px 5px, 5px 5px;
      background-repeat: no-repeat;
      padding-right: 28px;
      font-size: 0.88rem;
      font-weight: 600;
    }

    select:focus,
    input[type="text"].ctrl:focus,
    input[type="time"].ctrl:focus {
      outline: none;
      background-color: #fefce8;
    }

    .offset-input {
      font-family: var(--mono) !important;
      font-weight: 700;
      text-align: center;
      font-variant-numeric: tabular-nums;
    }

    .offset-input.invalid {
      background-color: #fee2e2 !important;
      border-color: #dc2626 !important;
    }

    .time-input {
      font-family: var(--mono) !important;
      font-size: 1.65rem !important;
      font-weight: 800;
      padding: 10px 12px !important;
      min-height: 54px !important;
      font-variant-numeric: tabular-nums;
    }

    .readout {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding-top: 8px;
      border-top: 1.5px dashed #d4d4d0;
    }

    .readout .ampm {
      font-size: 1.15rem;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .readout .fmt24 {
      font-family: var(--mono);
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--muted);
    }

    .footer-note {
      margin-top: 20px;
      font-family: var(--mono);
      font-size: 0.74rem;
      color: var(--muted);
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
    }

    .footer-note code {
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 1px 5px;
      color: var(--ink);
      font-weight: 700;
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-prompt">&gt;_</span>
      <span>TimeTickZone</span>
    </div>
    <div class="actions">
      <span id="modePill" class="status-pill"><span id="modeDot" class="dot"></span> <span id="modeText">LIVE</span></span>
      <button type="button" id="installBtn" class="btn primary" hidden>INSTALL</button>
      <button type="button" id="swapBtn" class="btn" title="Swap both time zones">⇄ SWAP</button>
      <button type="button" id="nowBtn" class="btn" title="Sync to live current time">⏱ LIVE</button>
    </div>
  </header>

  <main class="container">
    <section class="hero">
      <h1>TimeTickZone.</h1>
      <p class="hero-sub">Live time zone sync. Ticks every minute automatically—or enter any time to check a slot.</p>
    </section>

    <div id="diffBanner" class="diff-bar"></div>

    <section class="grid">
      <!-- Card A -->
      <article id="cardA" class="card active">
        <div class="card-header">
          <input id="labelA" class="label-input" type="text" value="My Time" aria-label="First person label" />
          <span id="dayA" class="day-badge">REFERENCE</span>
        </div>

        <div class="card-body">
          <div class="field">
            <label for="selectA">Time Zone // Select or Type Offset</label>
            <div class="tz-row">
              <select id="selectA" aria-label="Select first time zone"></select>
              <input id="offsetA" class="ctrl offset-input" type="text" placeholder="+5:30" aria-label="Manual UTC offset for first time zone" />
            </div>
          </div>

          <div class="field">
            <label for="timeA">Time</label>
            <input id="timeA" class="ctrl time-input" type="time" step="60" />
            <div class="readout">
              <span id="ampmA" class="ampm">--:--</span>
              <span id="fmt24A" class="fmt24">--:-- // UTC+0:00</span>
            </div>
          </div>
        </div>
      </article>

      <!-- Card B -->
      <article id="cardB" class="card">
        <div class="card-header">
          <input id="labelB" class="label-input" type="text" value="Friend's Time" aria-label="Second person label" />
          <span id="dayB" class="day-badge">SAME DAY</span>
        </div>

        <div class="card-body">
          <div class="field">
            <label for="selectB">Time Zone // Select or Type Offset</label>
            <div class="tz-row">
              <select id="selectB" aria-label="Select second time zone"></select>
              <input id="offsetB" class="ctrl offset-input" type="text" placeholder="+1:00" aria-label="Manual UTC offset for second time zone" />
            </div>
          </div>

          <div class="field">
            <label for="timeB">Time</label>
            <input id="timeB" class="ctrl time-input" type="time" step="60" />
            <div class="readout">
              <span id="ampmB" class="ampm">--:--</span>
              <span id="fmt24B" class="fmt24">--:-- // UTC+0:00</span>
            </div>
          </div>
        </div>
      </article>
    </section>

    <footer class="footer-note">
      <span>MANUAL OFFSET: <code>+5:30</code> <code>+1</code> <code>-4</code> <code>-07:30</code></span>
      <span id="saveStatus">CONFIG SAVED LOCALLY</span>
    </footer>
  </main>

  <script>
    (function () {
      const STORAGE_KEY = "tz_sync_config_v1";

      const PRESETS = [
        { minutes: -720, label: "UTC-12:00 (Baker Island)" },
        { minutes: -660, label: "UTC-11:00 (Samoa)" },
        { minutes: -600, label: "UTC-10:00 (Hawaii)" },
        { minutes: -570, label: "UTC-09:30 (Marquesas)" },
        { minutes: -540, label: "UTC-09:00 (Alaska)" },
        { minutes: -480, label: "UTC-08:00 (Pacific / LA)" },
        { minutes: -420, label: "UTC-07:00 (Mountain / Denver)" },
        { minutes: -360, label: "UTC-06:00 (Central / Chicago)" },
        { minutes: -300, label: "UTC-05:00 (Eastern / New York)" },
        { minutes: -240, label: "UTC-04:00 (Atlantic)" },
        { minutes: -210, label: "UTC-03:30 (Newfoundland)" },
        { minutes: -180, label: "UTC-03:00 (São Paulo / Buenos Aires)" },
        { minutes: -120, label: "UTC-02:00 (South Georgia)" },
        { minutes: -60,  label: "UTC-01:00 (Azores)" },
        { minutes: 0,    label: "UTC+00:00 (London / UTC)" },
        { minutes: 60,   label: "UTC+01:00 (Berlin / Paris / Lagos)" },
        { minutes: 120,  label: "UTC+02:00 (Cairo / Athens / Johannesburg)" },
        { minutes: 180,  label: "UTC+03:00 (Moscow / Riyadh / Nairobi)" },
        { minutes: 210,  label: "UTC+03:30 (Tehran)" },
        { minutes: 240,  label: "UTC+04:00 (Dubai / Baku)" },
        { minutes: 270,  label: "UTC+04:30 (Kabul)" },
        { minutes: 300,  label: "UTC+05:00 (Karachi / Tashkent)" },
        { minutes: 330,  label: "UTC+05:30 (India / Sri Lanka)" },
        { minutes: 345,  label: "UTC+05:45 (Nepal)" },
        { minutes: 360,  label: "UTC+06:00 (Dhaka / Almaty)" },
        { minutes: 390,  label: "UTC+06:30 (Yangon)" },
        { minutes: 420,  label: "UTC+07:00 (Bangkok / Jakarta)" },
        { minutes: 480,  label: "UTC+08:00 (Singapore / Beijing / Perth)" },
        { minutes: 525,  label: "UTC+08:45 (Eucla)" },
        { minutes: 540,  label: "UTC+09:00 (Tokyo / Seoul)" },
        { minutes: 570,  label: "UTC+09:30 (Adelaide)" },
        { minutes: 600,  label: "UTC+10:00 (Sydney / Guam)" },
        { minutes: 630,  label: "UTC+10:30 (Lord Howe)" },
        { minutes: 660,  label: "UTC+11:00 (Solomon Islands)" },
        { minutes: 720,  label: "UTC+12:00 (Auckland / Fiji)" },
        { minutes: 765,  label: "UTC+12:45 (Chatham Islands)" },
        { minutes: 780,  label: "UTC+13:00 (Tonga / Samoa)" },
        { minutes: 840,  label: "UTC+14:00 (Line Islands)" }
      ];

      const els = {
        labelA: document.getElementById("labelA"),
        labelB: document.getElementById("labelB"),
        selectA: document.getElementById("selectA"),
        selectB: document.getElementById("selectB"),
        offsetA: document.getElementById("offsetA"),
        offsetB: document.getElementById("offsetB"),
        timeA: document.getElementById("timeA"),
        timeB: document.getElementById("timeB"),
        ampmA: document.getElementById("ampmA"),
        ampmB: document.getElementById("ampmB"),
        fmt24A: document.getElementById("fmt24A"),
        fmt24B: document.getElementById("fmt24B"),
        dayA: document.getElementById("dayA"),
        dayB: document.getElementById("dayB"),
        cardA: document.getElementById("cardA"),
        cardB: document.getElementById("cardB"),
        diffBanner: document.getElementById("diffBanner"),
        swapBtn: document.getElementById("swapBtn"),
        nowBtn: document.getElementById("nowBtn"),
        modeDot: document.getElementById("modeDot"),
        modeText: document.getElementById("modeText"),
        saveStatus: document.getElementById("saveStatus")
      };

      let state = {
        labelA: "My Time",
        labelB: "Friend's Time",
        offsetA: 330,
        offsetB: 60,
        anchor: "A",
        live: true,
        minutesOfDay: 0
      };

      let tickTimer = null;
      let saveTimer = null;

      function formatOffset(mins) {
        const sign = mins >= 0 ? "+" : "-";
        const abs = Math.abs(mins);
        const h = Math.floor(abs / 60);
        const m = abs % 60;
        return `${sign}${h}:${String(m).padStart(2, "0")}`;
      }

      function parseOffset(str) {
        if (!str) return null;
        let s = str.trim().toUpperCase().replace(/^(UTC|GMT)\s*/, "");
        if (s === "" || s === "Z") return 0;

        const match = s.match(/^([+-]?)\s*(\d{1,2})(?::?(\d{2}))?$/);
        if (!match) return null;

        const sign = match[1] === "-" ? -1 : 1;
        const hours = parseInt(match[2], 10);
        const mins = match[3] ? parseInt(match[3], 10) : 0;

        if (mins >= 60 || hours > 14 || (hours === 14 && mins > 0)) {
          return null;
        }
        return sign * (hours * 60 + mins);
      }

      function populateSelect(selectEl) {
        const customOpt = document.createElement("option");
        customOpt.value = "custom";
        customOpt.textContent = "Custom offset…";
        selectEl.appendChild(customOpt);

        for (const p of PRESETS) {
          const opt = document.createElement("option");
          opt.value = String(p.minutes);
          opt.textContent = p.label;
          selectEl.appendChild(opt);
        }
      }

      function syncSelectWithOffset(selectEl, offsetMins) {
        const match = PRESETS.find((p) => p.minutes === offsetMins);
        selectEl.value = match ? String(match.minutes) : "custom";
      }

      function formatTime24(totalMins) {
        const wrapped = ((totalMins % 1440) + 1440) % 1440;
        const h = Math.floor(wrapped / 60);
        const m = wrapped % 60;
        return `${String(h).padStart(2, "0")}:${String(m).padStart(2, "0")}`;
      }

      function formatTime12(totalMins) {
        const wrapped = ((totalMins % 1440) + 1440) % 1440;
        const h24 = Math.floor(wrapped / 60);
        const m = wrapped % 60;
        const period = h24 >= 12 ? "PM" : "AM";
        const h12 = h24 % 12 === 0 ? 12 : h24 % 12;
        return `${h12}:${String(m).padStart(2, "0")} ${period}`;
      }

      function parseTimeInput(val) {
        if (!val || !val.includes(":")) return null;
        const [h, m] = val.split(":").map(Number);
        if (Number.isNaN(h) || Number.isNaN(m)) return null;
        return h * 60 + m;
      }

      function formatDuration(diffMins) {
        const abs = Math.abs(diffMins);
        const h = Math.floor(abs / 60);
        const m = abs % 60;
        if (h === 0 && m === 0) return "0M";
        if (m === 0) return `${h}H`;
        if (h === 0) return `${m}M`;
        return `${h}H ${m}M`;
      }

      function renderDayBadge(badgeEl, dayShift, isAnchor) {
        if (isAnchor) {
          badgeEl.textContent = "REFERENCE";
          badgeEl.classList.remove("shifted");
          return;
        }
        if (dayShift === 0) {
          badgeEl.textContent = "SAME DAY";
          badgeEl.classList.remove("shifted");
        } else if (dayShift > 0) {
          badgeEl.textContent = `+${dayShift} DAY`;
          badgeEl.classList.add("shifted");
        } else {
          badgeEl.textContent = `${dayShift} DAY`;
          badgeEl.classList.add("shifted");
        }
      }

      function escapeHtml(str) {
        return str
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      function updateLiveTime() {
        const now = new Date();
        const utcMins = now.getUTCHours() * 60 + now.getUTCMinutes();
        const anchorOffset = state.anchor === "A" ? state.offsetA : state.offsetB;
        state.minutesOfDay = ((utcMins + anchorOffset) % 1440 + 1440) % 1440;
      }

      function scheduleNextMinuteTick() {
        clearTimeout(tickTimer);
        if (!state.live) return;
        const now = new Date();
        const msUntilNextMinute = (60 - now.getSeconds()) * 1000 - now.getMilliseconds() + 50;
        tickTimer = setTimeout(() => {
          if (state.live) {
            updateLiveTime();
            render();
            scheduleNextMinuteTick();
          }
        }, Math.max(250, msUntilNextMinute));
      }

      function render() {
        if (state.live) {
          updateLiveTime();
        }

        const isAAnchor = state.anchor === "A";
        const diffAB = state.offsetB - state.offsetA;

        let rawA, rawB;
        if (isAAnchor) {
          rawA = state.minutesOfDay;
          rawB = rawA + diffAB;
        } else {
          rawB = state.minutesOfDay;
          rawA = rawB - diffAB;
        }

        const dayShiftA = Math.floor(rawA / 1440);
        const dayShiftB = Math.floor(rawB / 1440);

        const str24A = formatTime24(rawA);
        const str24B = formatTime24(rawB);

        if (document.activeElement !== els.timeA) {
          els.timeA.value = str24A;
        }
        if (document.activeElement !== els.timeB) {
          els.timeB.value = str24B;
        }

        els.ampmA.textContent = formatTime12(rawA);
        els.ampmB.textContent = formatTime12(rawB);
        els.fmt24A.textContent = `${str24A} // UTC${formatOffset(state.offsetA)}`;
        els.fmt24B.textContent = `${str24B} // UTC${formatOffset(state.offsetB)}`;

        renderDayBadge(els.dayA, dayShiftA, isAAnchor);
        renderDayBadge(els.dayB, dayShiftB, !isAAnchor);

        els.cardA.classList.toggle("active", isAAnchor);
        els.cardB.classList.toggle("active", !isAAnchor);

        els.modeDot.classList.toggle("paused", !state.live);
        els.modeText.textContent = state.live ? "LIVE" : "CUSTOM";
        els.nowBtn.classList.toggle("primary", !state.live);

        const nameA = state.labelA.trim() || "Side A";
        const nameB = state.labelB.trim() || "Side B";
        if (diffAB === 0) {
          els.diffBanner.innerHTML =
            `<span class="diff-text"><strong>${escapeHtml(nameA)}</strong> &amp; <strong>${escapeHtml(nameB)}</strong> are in the same time zone.</span>` +
            `<span class="diff-tag">DIFF // 0H</span>`;
        } else {
          const relation = diffAB > 0 ? "ahead of" : "behind";
          const dur = formatDuration(diffAB);
          els.diffBanner.innerHTML =
            `<span class="diff-text"><strong>${escapeHtml(nameB)}</strong> is ${dur.toLowerCase()} ${relation} <strong>${escapeHtml(nameA)}</strong>.</span>` +
            `<span class="diff-tag">DIFF // ${dur}</span>`;
        }
      }

      function saveConfig() {
        try {
          const toSave = {
            labelA: state.labelA,
            labelB: state.labelB,
            offsetA: state.offsetA,
            offsetB: state.offsetB,
            anchor: state.anchor
          };
          localStorage.setItem(STORAGE_KEY, JSON.stringify(toSave));
          els.saveStatus.textContent = "SAVED JUST NOW";
          clearTimeout(saveTimer);
          saveTimer = setTimeout(() => {
            els.saveStatus.textContent = "CONFIG SAVED LOCALLY";
          }, 1500);
        } catch {
          // Ignore storage errors if blocked
        }
      }

      function loadConfig() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (raw) {
            const parsed = JSON.parse(raw);
            if (typeof parsed.offsetA === "number") state.offsetA = parsed.offsetA;
            if (typeof parsed.offsetB === "number") state.offsetB = parsed.offsetB;
            if (typeof parsed.labelA === "string") state.labelA = parsed.labelA;
            if (typeof parsed.labelB === "string") state.labelB = parsed.labelB;
            if (parsed.anchor === "A" || parsed.anchor === "B") state.anchor = parsed.anchor;
          }
        } catch {
          // Fallback to defaults
        }
      }

      function enableLiveMode() {
        state.live = true;
        render();
        scheduleNextMinuteTick();
      }

      function bindSide(side) {
        const isA = side === "A";
        const labelEl = isA ? els.labelA : els.labelB;
        const selectEl = isA ? els.selectA : els.selectB;
        const offsetEl = isA ? els.offsetA : els.offsetB;
        const timeEl = isA ? els.timeA : els.timeB;
        const offsetKey = isA ? "offsetA" : "offsetB";
        const labelKey = isA ? "labelA" : "labelB";

        labelEl.addEventListener("input", () => {
          state[labelKey] = labelEl.value;
          render();
          saveConfig();
        });

        selectEl.addEventListener("change", () => {
          if (selectEl.value === "custom") {
            offsetEl.focus();
            offsetEl.select();
            return;
          }
          const mins = parseInt(selectEl.value, 10);
          state[offsetKey] = mins;
          offsetEl.value = formatOffset(mins);
          offsetEl.classList.remove("invalid");
          render();
          saveConfig();
        });

        offsetEl.addEventListener("input", () => {
          const parsed = parseOffset(offsetEl.value);
          if (parsed === null) {
            offsetEl.classList.add("invalid");
            return;
          }
          offsetEl.classList.remove("invalid");
          state[offsetKey] = parsed;
          syncSelectWithOffset(selectEl, parsed);
          render();
          saveConfig();
        });

        offsetEl.addEventListener("blur", () => {
          offsetEl.classList.remove("invalid");
          offsetEl.value = formatOffset(state[offsetKey]);
        });

        timeEl.addEventListener("input", () => {
          const mins = parseTimeInput(timeEl.value);
          if (mins === null) return;
          state.live = false;
          clearTimeout(tickTimer);
          state.anchor = side;
          state.minutesOfDay = mins;
          render();
          saveConfig();
        });
      }

      populateSelect(els.selectA);
      populateSelect(els.selectB);
      loadConfig();

      els.labelA.value = state.labelA;
      els.labelB.value = state.labelB;
      els.offsetA.value = formatOffset(state.offsetA);
      els.offsetB.value = formatOffset(state.offsetB);
      syncSelectWithOffset(els.selectA, state.offsetA);
      syncSelectWithOffset(els.selectB, state.offsetB);

      bindSide("A");
      bindSide("B");

      els.swapBtn.addEventListener("click", () => {
        [state.offsetA, state.offsetB] = [state.offsetB, state.offsetA];
        [state.labelA, state.labelB] = [state.labelB, state.labelA];
        state.anchor = state.anchor === "A" ? "B" : "A";

        els.labelA.value = state.labelA;
        els.labelB.value = state.labelB;
        els.offsetA.value = formatOffset(state.offsetA);
        els.offsetB.value = formatOffset(state.offsetB);
        syncSelectWithOffset(els.selectA, state.offsetA);
        syncSelectWithOffset(els.selectB, state.offsetB);

        render();
        saveConfig();
      });

      els.nowBtn.addEventListener("click", enableLiveMode);

      document.addEventListener("visibilitychange", () => {
        if (!document.hidden && state.live) {
          render();
          scheduleNextMinuteTick();
        }
      });

      window.addEventListener("focus", () => {
        if (state.live) {
          render();
          scheduleNextMinuteTick();
        }
      });

      const installBtn = document.getElementById("installBtn");
      let deferredPrompt = null;

      window.addEventListener("beforeinstallprompt", (e) => {
        e.preventDefault();
        deferredPrompt = e;
        installBtn.hidden = false;
      });

      installBtn.addEventListener("click", async () => {
        if (!deferredPrompt) return;
        deferredPrompt.prompt();
        await deferredPrompt.userChoice;
        deferredPrompt = null;
        installBtn.hidden = true;
      });

      window.addEventListener("appinstalled", () => {
        installBtn.hidden = true;
        deferredPrompt = null;
      });

      if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
        let refreshing = false;
        navigator.serviceWorker.addEventListener("controllerchange", () => {
          if (refreshing) return;
          refreshing = true;
          window.location.reload();
        });
        navigator.serviceWorker.register("./sw.js").catch(() => {});
      }

      render();
      scheduleNextMinuteTick();
    })();
  </script>
</body>
</html>
